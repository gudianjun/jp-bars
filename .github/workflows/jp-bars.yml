name: jp-bars
on:
  schedule:
    - cron: "10 0 * * 1-5"   # JST 09:10 开盘后（拿今日始値）
    - cron: "45 6 * * 1-5"   # JST 15:45 收盘后
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - run: python fetch_jp.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data
          git commit -m "bars $(TZ=Asia/Tokyo date +%F_%H%M)" || echo "no change"
          git push
